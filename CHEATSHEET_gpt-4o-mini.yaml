      - name: load_nodes_jsonl
        qualname: load_nodes_jsonl
        summary: 'Reads a JSON Lines file from the specified path and returns a list of dictionaries representing the JSON objects, or an empty list if the file does not exist.'
      - name: load_nodes_map
        qualname: load_nodes_map
