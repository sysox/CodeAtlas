        summary: "Retrieves a node's information from a nodes map by its identifier, given a root path."
      - name: resolve_content
        qualname: resolve_content
        summary: "Resolves the content of a specified file by its relative path, given a root directory and a node ID prefixed with 'ref:path:', returning the file's text as a string."
  - path: src/codeatlas/scan.py
    symbols:
      - name: _match_any
        qualname: _match_any
