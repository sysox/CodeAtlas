    symbols:
      - name: find_usages_with_grep
        qualname: find_usages_with_grep
        summary: 'Given a root directory and a symbol, `find_usages_with_grep` uses `git grep` to find potential usages of the symbol within files under that directory, returning a list of dictionaries containing the file path, line number, and code snippet for each match.'
  - path: src/codeatlas/apply.py
    symbols:
      - name: SymbolReplacer
        qualname: SymbolReplacer
        summary: "The SymbolReplacer class is a LibCST transformer that replaces a specified function or class definition within a Python code's CST (Concrete Syntax Tree) with new code provided as a string, using the fully qualified name to identify the target symbol."
        children:
          - name: __init__
            qualname: SymbolReplacer.__init__
            summary: "Initializes the `SymbolReplacer` instance with the target symbol's qualified name and new code, and sets up internal state for tracking the replacement process."
          - name: visit_ClassDef
            qualname: SymbolReplacer.visit_ClassDef
            summary: "The `visit_ClassDef` method of the `SymbolReplacer` class pushes the class name onto a stack to track the current qualified name and returns `True` to continue traversing the class's child nodes."
          - name: leave_ClassDef
            qualname: SymbolReplacer.leave_ClassDef
            summary: "Pops the current class's qualified name from a tracking stack and delegates to a shared helper method to finalize the processing of the `ClassDef` node after its children have been visited."
          - name: visit_FunctionDef
            qualname: SymbolReplacer.visit_FunctionDef
            summary: 'The `visit_FunctionDef` method adds the name of a function definition node to a stack to track the current qualified name and returns `True` to continue traversing the tree.'
          - name: leave_FunctionDef
            qualname: SymbolReplacer.leave_FunctionDef
            summary: "Pops the current function's qualified name from a state stack and delegates the final node transformation to a common helper method upon leaving a `cst.FunctionDef` node during a tree traversal."
          - name: _leave_definable_node
            qualname: SymbolReplacer._leave_definable_node
            summary: "If the current node's qualified name matches the target qualified name, this function replaces the node with a parsed CST node derived from provided code, otherwise, it returns the updated node."
      - name: apply_with_cst
        qualname: apply_with_cst
        summary: 'Replaces a specified symbol in Python source code with new code using LibCST, returning the modified source code and a boolean indicating success.'
      - name: run_command
        qualname: run_command
        summary: 'The `run_command` function executes a shell command in a specified directory, captures its output, and returns a dictionary containing the command, exit code, standard output, and standard error.'
      - name: apply_change_packet
        qualname: apply_change_packet
        summary: 'The `apply_change_packet` function applies code changes, executes shell commands, and performs git operations defined in a change packet (JSON file) to a given workspace, returning a dictionary containing the results of each operation.'
  - path: src/codeatlas/cli.py
    symbols:
      - name: main
        qualname: main
        summary: 'The `main` function parses command-line arguments to execute various atlas subcommands for workspace management, indexing, code analysis, and applying changes, returning an exit code.'
  - path: src/codeatlas/compression.py
    symbols:
      - name: compress_node
        qualname: compress_node
        summary: 'The `compress_node` function transforms a node dictionary into a compressed format for a Generic Code Tree, optionally expanding file or block content from disk based on provided path and anchor information, and returns the compressed dictionary.'
      - name: build_machine_core
        qualname: build_machine_core
        summary: "The `build_machine_core` function compresses a project's nodes into a dictionary representation, optionally expanding specified node IDs, and returns a dictionary containing the compressed nodes and version information."
  - path: src/codeatlas/ctx.py
    symbols:
      - name: _cap_bytes
        qualname: _cap_bytes
        summary: 'The function `_cap_bytes` truncates a UTF-8 string `s` to a maximum byte length `max_bytes`, returning the truncated string and a boolean indicating whether truncation occurred.'
      - name: _slice_lines
        qualname: _slice_lines
        summary: 'The `_slice_lines` function takes a string, an optional head integer, and an optional tail integer as input, and returns a tuple containing a sliced string based on head/tail parameters and a boolean indicating whether the string was truncated.'
      - name: build_ctx
        qualname: build_ctx
        summary: 'The `build_ctx` function resolves nodes from a list of paths and IDs within a root directory, optionally fetching and manipulating their content based on slicing and size parameters, and returns a JSON-serializable dictionary containing the resulting context bundle and any errors.'
  - path: src/codeatlas/diff.py
    symbols:
      - name: compute_diff
        qualname: compute_diff
        summary: 'This function computes the difference between the current and previously saved file fingerprints within a given root directory, returning a dictionary with the total file count and a diff of added, modified, and removed files.'
  - path: src/codeatlas/fingerprint.py
    symbols:
      - name: fingerprint_file
        qualname: fingerprint_file
        summary: 'Computes the SHA-256 hash for the file at the given `path` by reading it in chunks and returns the result as a hexadecimal string.'
      - name: build_fingerprints
        qualname: build_fingerprints
        summary: 'The function `build_fingerprints` takes a root path and a list of relative paths, calculates a fingerprint for each file at the joined path, and returns a dictionary mapping relative paths to their corresponding fingerprints.'
      - name: diff_fingerprints
        qualname: diff_fingerprints
        summary: 'The function `diff_fingerprints` takes two dictionaries representing old and new fingerprints and returns a dictionary containing lists of added, deleted, changed, and unchanged keys between the two input dictionaries.'
  - path: src/codeatlas/grep.py
    symbols:
