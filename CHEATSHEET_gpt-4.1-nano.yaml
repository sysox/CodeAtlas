        summary: 'Writes a Python object as formatted JSON to the specified file path, creating parent directories if needed.'
      - name: load_nodes_jsonl
        qualname: load_nodes_jsonl
        summary: 'Loads and parses a JSONL file from the given file path into a list of dictionaries, returning an empty list if the file does not exist.'
      - name: load_nodes_map
        qualname: load_nodes_map
        summary: 'Loads a JSONL file from the given path and returns a dictionary mapping node IDs (strings) to their respective data dictionaries.'
      - name: write_nodes_jsonl
        qualname: write_nodes_jsonl
