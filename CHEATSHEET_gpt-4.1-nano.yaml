  - path: src/codeatlas/analysis.py
    symbols:
      - name: find_usages_with_grep
        qualname: find_usages_with_grep
        summary: 'find_usages_with_grep searches for potential usages of a specified symbol within a codebase rooted at a given directory by performing a word-boundary grep using git, returning a list of matches with file path, line number, and code line.'
  - path: src/codeatlas/apply.py
    symbols:
      - name: SymbolReplacer
        qualname: SymbolReplacer
        summary: 'A LibCST transformer that replaces a specific function or class definition identified by its qualified name with new code provided as a string, returning the modified CST node.'
        children:
          - name: __init__
            qualname: SymbolReplacer.__init__
            summary: 'Initializes a SymbolReplacer instance with the qualified name (as a dot-separated string) and new code string, setting up internal state for performing symbol replacement.'
          - name: visit_ClassDef
            qualname: SymbolReplacer.visit_ClassDef
            summary: 'Visits a class definition node in the AST, appends the class name to the current qualified name stack, and continues traversing its children.'
          - name: leave_ClassDef
            qualname: SymbolReplacer.leave_ClassDef
            summary: 'Handles the exiting of a class definition node during AST traversal by updating context and returning the modified node.'
          - name: visit_FunctionDef
            qualname: SymbolReplacer.visit_FunctionDef
            summary: 'Visits a function definition node to record its name in the qualification stack, returning True to continue traversal.'
          - name: leave_FunctionDef
            qualname: SymbolReplacer.leave_FunctionDef
            summary: "Removes the current function's name from the qualified name stack and processes the function definition node after visiting its children."
          - name: _leave_definable_node
            qualname: SymbolReplacer._leave_definable_node
            summary: "Checks if the current node's qualified name matches the target, and if so, replaces it with a new node parsed from code; otherwise, returns the updated node."
      - name: apply_with_cst
        qualname: apply_with_cst
        summary: 'Applies a symbol replacement to the given source code using LibCST, returning the modified code and a success flag based on whether the replacement was performed.'
      - name: run_command
        qualname: run_command
        summary: 'The run_command function executes a shell command provided as a string within a specified directory and returns a dictionary containing the command, exit code, standard output, and standard error.'
      - name: apply_change_packet
        qualname: apply_change_packet
        summary: 'apply_change_packet applies a specified set of code modifications, run commands, and git operations to a workspace based on a change packet file, returning success status and operation results.'
  - path: src/codeatlas/cli.py
    symbols:
      - name: main
        qualname: main
        summary: 'Defines the main entry point function that parses command-line arguments for various workspace management, code analysis, transformation, and reporting commands, executing the corresponding operations and returning an integer status code.'
  - path: src/codeatlas/compression.py
    symbols:
      - name: compress_node
        qualname: compress_node
        summary: 'Compresses a node into a concise format with identifiers, type, children, metadata, and optionally expands content or code snippets based on node type and flags.'
      - name: build_machine_core
        qualname: build_machine_core
        summary: "build_machine_core generates a compressed JSON representation of a project's node structure, optionally expanding specified nodes based on provided IDs."
  - path: src/codeatlas/ctx.py
    symbols:
      - name: _cap_bytes
        qualname: _cap_bytes
        summary: '_cap_bytes is a function that takes a string s and an optional maximum byte size max_bytes, returning a possibly truncated version of s (adding a truncation indicator) to ensure its UTF-8 byte length does not exceed max_bytes, along with a boolean indicating whether truncation occurred.'
      - name: _slice_lines
        qualname: _slice_lines
        summary: '_slice_lines extracts specified leading and/or trailing lines from a string s based on optional head and tail integers, returning the resulting string and a boolean indicating if truncation occurred.'
      - name: build_ctx
        qualname: build_ctx
        summary: 'build_ctx constructs a JSON-serializable context bundle for LLMs by resolving specified paths and IDs to nodes, optionally including content slices with size constraints, and reporting any encountered errors.'
  - path: src/codeatlas/diff.py
    symbols:
      - name: compute_diff
        qualname: compute_diff
        summary: 'Computes and returns the difference between previous and current file fingerprints within a specified directory, based on configuration and file scanning.'
  - path: src/codeatlas/fingerprint.py
    symbols:
      - name: fingerprint_file
        qualname: fingerprint_file
        summary: 'Computes and returns the SHA-256 hash fingerprint of the file located at the given path.'
      - name: build_fingerprints
        qualname: build_fingerprints
        summary: 'Builds a dictionary mapping relative file paths to their fingerprints by computing file hashes for each path based on a specified root directory.'
      - name: diff_fingerprints
        qualname: diff_fingerprints
        summary: "Compares two dictionaries of fingerprints, returning a dict with keys 'added', 'deleted', 'changed', and 'unchanged', each mapping to lists of keys indicating their respective differences."
  - path: src/codeatlas/grep.py
    symbols:
      - name: grep_snippets
        qualname: grep_snippets
        summary: 'Searches for a regex pattern in a specified file under a root directory, returning snippets with matched lines and surrounding context up to a maximum number of matches.'
  - path: src/codeatlas/humanize.py
    symbols:
      - name: _generate_diff
        qualname: _generate_diff
        summary: 'Generates a unified diff string comparing previous and updated file contents given as strings, with a filename for context.'
      - name: _render_changes_to_yaml
        qualname: _render_changes_to_yaml
        summary: 'The _render_changes_to_yaml function takes a list of change dictionaries and a list of YAML lines, then appends formatted YAML representations of the changes—including file paths, operation types, symbols, reasons, and code diffs—to the lines list.'
      - name: render_proposal_yaml
        qualname: render_proposal_yaml
        summary: 'render_proposal_yaml converts a proposal data dictionary into a formatted YAML string summarizing the goal, impact (files and symbols modified), and lists of primary and dependent changes.'
      - name: render_project_cheatsheet
        qualname: render_project_cheatsheet
        summary: "The function render_project_cheatsheet generates a YAML-formatted cheatsheet summarizing a project's file structure, classes, and functions based on a provided machine_core dictionary and an optional detail level, returning it as a string."
        children:
          - name: render_node
            qualname: render_project_cheatsheet.render_node
            summary: "The function render_node(node_id: str, indent: int) recursively renders a hierarchical representation of a project structure's nodes—files and symbols—based on a node ID, appending formatted details to a lines list."
  - path: src/codeatlas/index.py
    symbols:
      - name: _kind_from_path
        qualname: _kind_from_path
        summary: "Determines the file type based on the lowercase extension of the input file path string, returning a string label such as 'py', 'md', 'tex', etc., or 'other' if no recognized extension matches."
      - name: build_or_update
        qualname: build_or_update
        summary: 'Builds or updates a deep index of a workspace by scanning files and symbols, creating nodes for each, and returning metadata about the process.'
  - path: src/codeatlas/layout.py
    symbols:
      - name: AtlasPaths
        qualname: AtlasPaths
        summary: "The AtlasPaths class manages and provides paths to various directories and files within a project rooted at 'root', facilitating directory creation and access to configuration, data, and log file locations."
        children:
          - name: atlas_dir
            qualname: AtlasPaths.atlas_dir
            summary: "The 'atlas_dir' property returns a Path object representing the '.atlas' directory located within the 'root' directory."
          - name: cfg_path
            qualname: AtlasPaths.cfg_path
            summary: "Returns the file path to the 'cfg.json' configuration file within the 'atlas_dir' directory as a Path object."
          - name: tree_dir
            qualname: AtlasPaths.tree_dir
            summary: "The method 'tree_dir' returns a Path object representing the 'tree' directory within the 'atlas_dir' attribute."
          - name: nodes_path
            qualname: AtlasPaths.nodes_path
            summary: "Returns a Path object pointing to the 'nodes.jsonl' file within the 'tree_dir' directory associated with the AtlasPaths instance."
          - name: index_dir
            qualname: AtlasPaths.index_dir
            summary: "Returns the Path object pointing to the 'index' directory within the 'tree_dir' attribute of the AtlasPaths instance."
          - name: paths_index_path
            qualname: AtlasPaths.paths_index_path
            summary: "Returns the file path to 'paths.json' within the 'index_dir' directory."
          - name: fingerprints_path
            qualname: AtlasPaths.fingerprints_path
            summary: "Returns the filesystem path to the 'fingerprints.json' file within the 'tree_dir' directory."
          - name: blobs_dir
            qualname: AtlasPaths.blobs_dir
            summary: "Returns the 'blobs' directory path by appending 'blobs' to the 'tree_dir' attribute."
          - name: log_dir
            qualname: AtlasPaths.log_dir
            summary: "Returns the Path object to the 'log' directory within the atlas_dir attribute."
          - name: ensure_dirs
            qualname: AtlasPaths.ensure_dirs
            summary: 'Creates the directory structure for atlas, tree, index, blobs, and log directories, ensuring all exist; no inputs or outputs.'
  - path: src/codeatlas/llm.py
    symbols:
      - name: call_llm_api
        qualname: call_llm_api
        summary: "call_llm_api prompts a specified language model provider ('openai' or 'gemini') with a given string prompt and configuration, returning the model's JSON response."
      - name: _call_openai
        qualname: _call_openai
        summary: '_call_openai sends a prompt to the specified OpenAI API endpoint using provided API key and configuration, then processes and returns the JSON-decoded response content or an error message.'
      - name: _call_gemini
        qualname: _call_gemini
        summary: 'Defines _call_gemini, a function that sends a prompt to the Google Gemini API using specified configuration and returns the structured response or error information.'
  - path: src/codeatlas/model.py
    symbols:
      - name: Node
        qualname: Node
        summary: 'The Node class models a hierarchical element with identifiers, type, path, optional anchor, summary, children, and metadata, and provides methods for serializing to and deserializing from a dictionary.'
        children:
          - name: to_dict
            qualname: Node.to_dict
            summary: "The Node.to_dict method serializes the node's attributes (id, type, path, children, and optionally anchor, summary, meta) into a dictionary for data interchange or storage."
          - name: from_dict
            qualname: Node.from_dict
            summary: 'Creates a Node instance from a dictionary with keys for id, type, path, and optional anchor, summary, children, and meta.'
      - name: make_id
        qualname: make_id
        summary: 'Generates a deterministic string ID based on the provided kind, relative path, and optional anchor, distinguishing between file-level IDs and more specific references.'
  - path: src/codeatlas/patch_skel.py
    symbols:
      - name: patch_skeleton
        qualname: patch_skeleton
        summary: 'Generates a BridgeAI packet skeleton for replacing a symbol or file at a specified path, with optional qualname, execution commands, and commit message, returning the constructed packet as a dictionary.'
  - path: src/codeatlas/plan.py
    symbols:
      - name: Target
        qualname: Target
        summary: "The 'Target' class represents a target with a file path and optional qualified name, used to identify or reference specific code elements or locations."
      - name: parse_target
        qualname: parse_target
        summary: "Parses a string 'path' or 'path::qualname' into a Target object with 'path' and optional 'qualname' attributes."
      - name: build_plan
        qualname: build_plan
        summary: 'Constructs a single-target build plan with specified parameters such as root directory, goal, path, quality name, content flag, range, size limit, operation, commands to run, and commit hash, by internally calling build_plan_multi.'
      - name: build_plan_multi
        qualname: build_plan_multi
        summary: 'Builds an intelligent context bundle for an LLM by resolving target files and symbol usages, producing a machine core and patch skeletons based on specified goals and operations.'
      - name: render_prompt_text
        qualname: render_prompt_text
        summary: 'The function render_prompt_text transforms a JSON bundle containing patches, machine core, and goal into a detailed text prompt for a language model, returning the prompt as a string.'
  - path: src/codeatlas/proposal.py
    symbols:
      - name: build_proposal_packet
        qualname: build_proposal_packet
        summary: 'Builds a self-contained proposal packet containing primary and dependent code changes for review, based on input bundle and change packet files.'
        children:
          - name: get_before_code
            qualname: build_proposal_packet.get_before_code
            summary: 'Retrieves the source code or content for a given file path and optional qualified symbol name, returning the code text or an error message.'
  - path: src/codeatlas/py_extract.py
    symbols:
      - name: extract_qualname_source
        qualname: extract_qualname_source
        summary: 'Extracts the source code slice for a specified qualified name from a Python file at a given path, returning source lines and metadata.'
  - path: src/codeatlas/py_symbols.py
    symbols:
      - name: Sym
        qualname: Sym
        summary: 'Sym is a class representing metadata about a Python symbol, including its qualified name, kind (class, function, or method), and its start and end line numbers, with a method to convert this information to a dictionary.'
        children:
          - name: to_dict
            qualname: Sym.to_dict
            summary: 'Converts the Sym object into a dictionary containing its qualname, kind, start_line, and end_line attributes.'
      - name: _Visitor
        qualname: _Visitor
        summary: 'A subclass of ast.NodeVisitor that traverses Python AST nodes to collect symbols representing classes, functions, and methods, recording their qualified names, types, and line numbers.'
        children:
          - name: __init__
            qualname: _Visitor.__init__
            summary: 'Initializes a Visitor instance with an empty stack and output list for traversing and processing symbol trees.'
          - name: visit_ClassDef
            qualname: _Visitor.visit_ClassDef
            summary: 'Visits an AST ClassDef node to record its qualified name and metadata, then recursively processes its child nodes.'
          - name: visit_FunctionDef
            qualname: _Visitor.visit_FunctionDef
            summary: 'Visits an ast.FunctionDef node to perform custom processing on function definitions, accepting the node as input and returning any result.'
          - name: visit_AsyncFunctionDef
            qualname: _Visitor.visit_AsyncFunctionDef
            summary: 'Handles visiting an asynchronous function definition node in an AST, processing its structure via the _visit_fn method.'
          - name: _visit_fn
            qualname: _Visitor._visit_fn
            summary: "Records the fully qualified name and type ('function' or 'method') of an AST node representing a function or method, along with its line numbers, during AST traversal."
      - name: list_python_symbols
        qualname: list_python_symbols
        summary: 'The function list_python_symbols takes a file path as input and returns a list of dictionaries detailing the qualified names and line spans of Python symbols (functions, classes, etc.) defined in the file, requiring Python 3.10+ for end_lineno support.'
  - path: src/codeatlas/resolve.py
    symbols:
      - name: lookup_path
        qualname: lookup_path
        summary: 'The function lookup_path takes a root directory and a relative path as inputs, and returns the associated path string from a JSON index if found, otherwise None.'
      - name: resolve_node
        qualname: resolve_node
        summary: "Retrieves a node's data as a dictionary from a nodes map using a given node_id within a specified root directory."
      - name: resolve_content
        qualname: resolve_content
        summary: "resolve_content takes a root directory and a node_id with prefix 'ref:path:', returning the entire text content of the file specified by the relative path encoded in node_id."
  - path: src/codeatlas/scan.py
    symbols:
      - name: _match_any
        qualname: _match_any
        summary: 'Checks if the given file path matches any pattern in the provided list, returning True or False.'
      - name: scan_files
        qualname: scan_files
        summary: "The scan_files function recursively traverses a directory tree starting at 'root', filtering files based on 'include' and 'exclude' patterns, and returns a sorted list of relative POSIX paths to the matching files."
  - path: src/codeatlas/state.py
    symbols:
