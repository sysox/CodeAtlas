        summary: 'The `Node` class is a data structure representing an element with an `id`, `type`, `path`, and `children`, which can be serialized to or deserialized from a dictionary using its `to_dict` and `from_dict` methods.'
        children:
          - name: to_dict
            qualname: Node.to_dict
