  - path: src/codeatlas/analysis.py
    symbols:
      - name: find_usages_with_grep
        qualname: find_usages_with_grep
        summary: 'Searches for potential usages of a given `symbol` string within a specified `root` directory using `git grep` and returns a list of dictionaries, each detailing the file path, line number, and code of a match.'
  - path: src/codeatlas/apply.py
    symbols:
      - name: SymbolReplacer
        qualname: SymbolReplacer
        summary: 'The SymbolReplacer is a LibCST transformer that replaces a specific function or class definition, identified by its fully qualified name, with a new code snippet provided as a string.'
        children:
          - name: __init__
            qualname: SymbolReplacer.__init__
            summary: 'Initializes the `SymbolReplacer` instance with a target qualified name and new code, preparing internal state variables for the replacement operation.'
          - name: visit_ClassDef
            qualname: SymbolReplacer.visit_ClassDef
            summary: 'Appends the name of a visited `cst.ClassDef` node to the current qualified name stack and returns `True` to continue traversal into the class body.'
          - name: leave_ClassDef
            qualname: SymbolReplacer.leave_ClassDef
            summary: "Pops the current class's qualified name from an internal state stack and returns the updated class definition node by delegating to a common handler."
          - name: visit_FunctionDef
            qualname: SymbolReplacer.visit_FunctionDef
            summary: "Appends the function's name to the current qualified name stack when visiting a `cst.FunctionDef` node and returns `True` to continue the CST traversal."
          - name: leave_FunctionDef
            qualname: SymbolReplacer.leave_FunctionDef
            summary: "When leaving a `cst.FunctionDef` node during a tree traversal, this method pops the function's qualified name from its internal stack and delegates the final transformation of the node to the `_leave_definable_node` method."
          - name: _leave_definable_node
            qualname: SymbolReplacer._leave_definable_node
            summary: 'This method compares the qualified name of the current CST node with a target name and, if they match, replaces the node with a new one parsed from a code string, otherwise returning the node unmodified.'
      - name: apply_with_cst
        qualname: apply_with_cst
        summary: 'This function uses LibCST to replace a symbol, identified by its qualified name, within a given source code string with new code, returning a tuple containing the potentially modified source code and a boolean indicating success.'
      - name: run_command
        qualname: run_command
        summary: "Executes a shell command string in a specified working directory and returns a dictionary containing the command's exit code, stdout, and stderr."
      - name: apply_change_packet
        qualname: apply_change_packet
        summary: 'This function validates and applies a change packet from a JSON file to a workspace root directory, executing code modifications, shell commands, and git operations, and returns a dictionary summarizing the results of each action.'
  - path: src/codeatlas/cli.py
    symbols:
      - name: main
        qualname: main
        summary: "The main function serves as the command-line interface entry point for the 'atlas' tool, parsing user arguments to dispatch various subcommands like `init`, `index`, and `plan`, and returns an integer exit code."
  - path: src/codeatlas/compression.py
    symbols:
      - name: compress_node
        qualname: compress_node
        summary: 'The `compress_node` function takes a node dictionary, an optional root path, and an `expand_content` flag to transform the node into a compact dictionary format, potentially replacing its content pointer with the actual source code from the file system.'
      - name: build_machine_core
        qualname: build_machine_core
        summary: "Generates a compressed 'Machine Core' dictionary representation of a project from a given `root` path, optionally expanding the content of nodes specified in `expand_ids`."
  - path: src/codeatlas/ctx.py
    symbols:
      - name: _cap_bytes
        qualname: _cap_bytes
        summary: 'Truncates a string to a specified maximum number of bytes, handling UTF-8 encoding safely, and returns the potentially shortened string along with a boolean indicating if truncation occurred.'
      - name: _slice_lines
        qualname: _slice_lines
        summary: 'This function slices a multi-line string `s` to include a specified number of `head` and/or `tail` lines, returning the resulting string and a boolean flag indicating if truncation occurred.'
      - name: build_ctx
        qualname: build_ctx
        summary: 'The `build_ctx` function resolves specified file paths and node IDs within a root directory, optionally fetching, slicing, and capping their content, and returns a JSON-serializable dictionary containing the resulting items and any processing errors.'
  - path: src/codeatlas/diff.py
    symbols:
      - name: compute_diff
        qualname: compute_diff
        summary: 'This function scans a given root directory for files based on configuration, computes the difference between their current and previously stored fingerprints, and returns a dictionary containing the diff and total file count.'
  - path: src/codeatlas/fingerprint.py
    symbols:
      - name: fingerprint_file
        qualname: fingerprint_file
        summary: 'Computes the SHA256 hash for a file at a given `Path` by reading it in chunks and returns the hash as a hexadecimal string.'
      - name: build_fingerprints
        qualname: build_fingerprints
        summary: 'Computes and returns a dictionary mapping each provided relative file path to its unique fingerprint, calculated relative to a given root directory.'
      - name: diff_fingerprints
        qualname: diff_fingerprints
        summary: "Compares two dictionaries of string fingerprints, `old` and `new`, and returns a dictionary categorizing keys into sorted lists of 'added', 'deleted', 'changed', or 'unchanged'."
  - path: src/codeatlas/grep.py
    symbols:
      - name: grep_snippets
        qualname: grep_snippets
        summary: 'Searches for lines matching a given regular expression pattern within a specified file and returns a dictionary containing snippets of the matches with surrounding context, up to a specified maximum number of hits.'
  - path: src/codeatlas/humanize.py
    symbols:
      - name: _generate_diff
        qualname: _generate_diff
        summary: 'Generates and returns a unified diff string by comparing two input strings, `before` and `after`, using a provided `filename`.'
      - name: _render_changes_to_yaml
        qualname: _render_changes_to_yaml
        summary: 'This helper function processes a list of dictionaries representing code changes, formats them into a human-readable YAML structure including diffs, and appends the resulting lines to an input list.'
      - name: render_proposal_yaml
        qualname: render_proposal_yaml
        summary: 'This function converts a dictionary containing causal proposal data into a formatted, human-readable YAML report string.'
      - name: render_project_cheatsheet
        qualname: render_project_cheatsheet
        summary: "This function takes a `machine_core` dictionary representing a project's structure and an integer `level` to generate a YAML-formatted string cheatsheet of the project's files and symbols."
        children:
          - name: render_node
            qualname: render_project_cheatsheet.render_node
            summary: 'Recursively renders a node from a project map, identified by its `node_id` and an `indent` level, by formatting its details and appending the resulting strings to a shared list to build a hierarchical cheatsheet.'
  - path: src/codeatlas/index.py
    symbols:
      - name: _kind_from_path
        qualname: _kind_from_path
        summary: "Determines and returns a file type identifier string such as 'py', 'md', or 'other' based on the file extension of the input relative path string."
      - name: build_or_update
        qualname: build_or_update
        summary: 'Given a `root` path, this function recursively scans the directory to build or update a hierarchical index of files and their internal code symbols, saves the results to JSON files, and returns a dictionary with summary statistics.'
  - path: src/codeatlas/layout.py
    symbols:
      - name: AtlasPaths
        qualname: AtlasPaths
        summary: 'The `AtlasPaths` class centralizes the management of file and directory paths for an Atlas project, deriving all locations from a root path and offering a method to ensure the necessary directories exist.'
        children:
          - name: atlas_dir
            qualname: AtlasPaths.atlas_dir
            summary: "Returns a `Path` object representing the `.atlas` directory located within the instance's root directory."
          - name: cfg_path
            qualname: AtlasPaths.cfg_path
            summary: "Returns a `Path` object for the 'cfg.json' file located within the `atlas_dir` directory."
          - name: tree_dir
            qualname: AtlasPaths.tree_dir
            summary: "Returns a `Path` object for the 'tree' directory, which is a subdirectory of the `atlas_dir`."
          - name: nodes_path
            qualname: AtlasPaths.nodes_path
            summary: 'Returns the `pathlib.Path` to the `nodes.jsonl` file located within the atlas tree directory.'
          - name: index_dir
            qualname: AtlasPaths.index_dir
            summary: "Returns the path to the 'index' directory, which is a subdirectory of the `tree_dir`."
          - name: paths_index_path
            qualname: AtlasPaths.paths_index_path
            summary: 'Returns a `Path` object for the `paths.json` file by joining the filename to the `index_dir` attribute.'
          - name: fingerprints_path
            qualname: AtlasPaths.fingerprints_path
            summary: 'Returns a `Path` object for the `fingerprints.json` file located in the `tree_dir` directory.'
          - name: blobs_dir
            qualname: AtlasPaths.blobs_dir
            summary: "Returns a `Path` object representing the 'blobs' directory located within the `tree_dir`."
          - name: log_dir
            qualname: AtlasPaths.log_dir
            summary: "Returns the `pathlib.Path` object for the 'log' subdirectory within the atlas directory."
          - name: ensure_dirs
            qualname: AtlasPaths.ensure_dirs
            summary: 'Ensures that the atlas, tree, index, blobs, and log directories exist by creating them on the filesystem if they are missing, taking no arguments and returning nothing.'
