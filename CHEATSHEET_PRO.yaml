  - path: src/codeatlas/analysis.py
    symbols:
      - name: find_usages_with_grep
        qualname: find_usages_with_grep
        summary: 'Uses `git grep` to find all usages of a given `symbol` string within a `root` directory, returning a list of dictionaries containing the file path, line number, and code for each match.'
  - path: src/codeatlas/apply.py
    symbols:
      - name: SymbolReplacer
        qualname: SymbolReplacer
        summary: 'The `SymbolReplacer` class is a LibCST transformer that finds a function or class definition in a syntax tree by its qualified name and replaces it with a new code snippet.'
        children:
          - name: __init__
            qualname: SymbolReplacer.__init__
            summary: "Initializes the `SymbolReplacer` instance with the target symbol's qualified name and new code, and sets up internal state for tracking the replacement process."
          - name: visit_ClassDef
            qualname: SymbolReplacer.visit_ClassDef
            summary: 'Appends the name of a visited `ClassDef` node to an internal qualified name stack and returns `True` to continue traversing its child nodes.'
          - name: leave_ClassDef
            qualname: SymbolReplacer.leave_ClassDef
            summary: "Pops the current class's qualified name from a tracking stack and delegates to a shared helper method to finalize the processing of the `ClassDef` node after its children have been visited."
          - name: visit_FunctionDef
            qualname: SymbolReplacer.visit_FunctionDef
            summary: "Appends the name of a visited `FunctionDef` node to an internal stack and returns `True` to continue traversing the node's children."
          - name: leave_FunctionDef
            qualname: SymbolReplacer.leave_FunctionDef
            summary: "Pops the current function's qualified name from a state stack and delegates the final node transformation to a common helper method upon leaving a `cst.FunctionDef` node during a tree traversal."
          - name: _leave_definable_node
            qualname: SymbolReplacer._leave_definable_node
            summary: 'This method compares the qualified name of the CST node being visited with a target name and, if they match, replaces the node with a new one parsed from a provided code string, otherwise returning the original node.'
      - name: apply_with_cst
        qualname: apply_with_cst
        summary: 'Using LibCST, this function replaces a symbol identified by its qualified name in a given source code string with new code, returning the potentially modified source code and a boolean indicating if the replacement was successful.'
      - name: run_command
        qualname: run_command
        summary: "Executes a given shell command string in a specified working directory and returns a dictionary containing the command's exit code, stdout, and stderr."
      - name: apply_change_packet
        qualname: apply_change_packet
        summary: "This function validates and applies a JSON change packet to a specified workspace root, performing code modifications (symbol/file replacement), executing 'run' commands, and handling 'git' operations, then returns a dictionary summarizing the outcome."
  - path: src/codeatlas/cli.py
    symbols:
      - name: main
        qualname: main
        summary: 'The `main` function acts as the command-line interface entry point, parsing arguments to execute various workspace management, code analysis, and automated patching subcommands, ultimately printing JSON results to standard output and returning an integer exit code.'
  - path: src/codeatlas/compression.py
    symbols:
      - name: compress_node
        qualname: compress_node
        summary: "Given a node dictionary, an optional root path, and an `expand_content` flag, this function compresses the node into a compact format, either creating a pointer to its source location or directly embedding the file or symbol's content into the resulting dictionary."
      - name: build_machine_core
        qualname: build_machine_core
        summary: "Generates a compressed 'Machine Core' dictionary representation of a project from a given root path, optionally expanding specified node IDs from pointers to inline text."
  - path: src/codeatlas/ctx.py
    symbols:
      - name: _cap_bytes
        qualname: _cap_bytes
        summary: 'Truncates a string `s` to a `max_bytes` limit by safely encoding to UTF-8, slicing the bytes, and decoding back, returning the resulting string and a boolean indicating if truncation occurred.'
      - name: _slice_lines
        qualname: _slice_lines
        summary: 'Slices a multi-line string to include a specified number of lines from the `head` and/or `tail`, returning the modified string and a boolean indicating if truncation occurred.'
      - name: build_ctx
        qualname: build_ctx
        summary: 'The `build_ctx` function resolves nodes from a list of paths and IDs within a root directory, optionally fetching and manipulating their content based on slicing and size parameters, and returns a JSON-serializable dictionary containing the resulting context bundle and any errors.'
  - path: src/codeatlas/diff.py
    symbols:
      - name: compute_diff
        qualname: compute_diff
        summary: 'This function computes the difference between the current and previously saved file fingerprints within a given root directory, returning a dictionary with the total file count and a diff of added, modified, and removed files.'
  - path: src/codeatlas/fingerprint.py
    symbols:
      - name: fingerprint_file
        qualname: fingerprint_file
        summary: 'Computes the SHA-256 hash for the file at the given `path` by reading it in chunks and returns the result as a hexadecimal string.'
      - name: build_fingerprints
        qualname: build_fingerprints
        summary: 'Computes content fingerprints for a collection of files specified by relative paths within a root directory, returning a dictionary mapping each relative path to its fingerprint.'
      - name: diff_fingerprints
        qualname: diff_fingerprints
        summary: "Compares two dictionaries of string fingerprints, `old` and `new`, to produce a dictionary categorizing their keys into sorted lists of 'added', 'deleted', 'changed', and 'unchanged'."
  - path: src/codeatlas/grep.py
    symbols:
      - name: grep_snippets
        qualname: grep_snippets
        summary: 'Searches a file at a given path for a regular expression pattern and returns a dictionary containing snippets of matching lines with surrounding context, or an error if the file is not found or the pattern is invalid.'
  - path: src/codeatlas/humanize.py
    symbols:
      - name: _generate_diff
        qualname: _generate_diff
        summary: 'Generates a unified diff string by comparing two input strings, `before` and `after`, using the provided `filename` for context in the diff output.'
      - name: _render_changes_to_yaml
        qualname: _render_changes_to_yaml
        summary: 'This helper function renders a list of dictionary-defined code changes into a human-readable YAML format and appends the resulting string lines to a given list.'
      - name: render_proposal_yaml
        qualname: render_proposal_yaml
        summary: 'Renders a human-readable YAML report as a string from an input dictionary of causal proposal data, summarizing its goal, impact, and changes.'
      - name: render_project_cheatsheet
        qualname: render_project_cheatsheet
        summary: "Generates a YAML-formatted string summarizing a project's structure from a `machine_core` dictionary, with the detail controlled by an optional `level` integer."
        children:
          - name: render_node
            qualname: render_project_cheatsheet.render_node
            summary: 'Recursively renders a file or symbol node identified by `node_id` with a specified `indent` level, formatting its details and appending the resulting string to an external list.'
  - path: src/codeatlas/index.py
    symbols:
      - name: _kind_from_path
        qualname: _kind_from_path
        summary: "This function determines a file's kind as a short string (e.g., 'py', 'md', 'other') from its relative path string by examining the file extension."
      - name: build_or_update
        qualname: build_or_update
        summary: "This function deeply indexes a workspace at a given `root` path by scanning files, creating hierarchical nodes for files and their contained Python symbols, writing the resulting index to disk, and returning a dictionary summarizing the operation's results."
  - path: src/codeatlas/layout.py
    symbols:
      - name: AtlasPaths
        qualname: AtlasPaths
        summary: 'The `AtlasPaths` class defines and manages the standardized file system paths for an Atlas project, deriving all locations from a single root directory and providing a method to ensure these directories exist.'
        children:
          - name: atlas_dir
            qualname: AtlasPaths.atlas_dir
            summary: "Returns a `Path` object representing the `.atlas` directory located within the object's root directory."
          - name: cfg_path
            qualname: AtlasPaths.cfg_path
            summary: 'Returns a `Path` object for the `cfg.json` configuration file located within the atlas directory.'
          - name: tree_dir
            qualname: AtlasPaths.tree_dir
            summary: "Returns the `Path` to the 'tree' subdirectory within the main atlas directory."
          - name: nodes_path
            qualname: AtlasPaths.nodes_path
            summary: 'Returns the `Path` object for the `nodes.jsonl` file located within the `tree_dir` directory.'
          - name: index_dir
            qualname: AtlasPaths.index_dir
            summary: 'Constructs and returns the `Path` object for the index directory located within the `tree_dir`.'
          - name: paths_index_path
            qualname: AtlasPaths.paths_index_path
            summary: "Returns the `Path` object for the `paths.json` file located within the object's `index_dir`."
          - name: fingerprints_path
            qualname: AtlasPaths.fingerprints_path
            summary: 'Returns the filesystem path to the `fingerprints.json` file located within the `tree_dir` directory.'
          - name: blobs_dir
            qualname: AtlasPaths.blobs_dir
            summary: "Returns a `Path` object representing the 'blobs' subdirectory within the `tree_dir`."
          - name: log_dir
            qualname: AtlasPaths.log_dir
            summary: "Returns the `Path` object for the log directory, which is a subdirectory named 'log' within the main atlas directory."
          - name: ensure_dirs
            qualname: AtlasPaths.ensure_dirs
            summary: 'This method creates the atlas, tree, index, blobs, and log directories on the filesystem, including any necessary parent directories, without raising an error if they already exist.'
  - path: src/codeatlas/llm.py
    symbols:
      - name: call_llm_api
        qualname: call_llm_api
        summary: "Takes a string prompt and a configuration dictionary to call a specified LLM provider's API (OpenAI or Gemini), returning the resulting JSON response."
      - name: _call_openai
        qualname: _call_openai
        summary: 'Sends a given prompt to an OpenAI chat completions endpoint using a provided API key and configuration, returning a dictionary containing the parsed JSON response on success or an error message on failure.'
      - name: _call_gemini
        qualname: _call_gemini
  - path: src/codeatlas/model.py
    symbols:
      - name: Node
        qualname: Node
        summary: 'The `Node` class is a data structure representing an element with an `id`, `type`, `path`, and `children`, which can be serialized to or deserialized from a dictionary using its `to_dict` and `from_dict` methods.'
        children:
          - name: to_dict
            qualname: Node.to_dict
            summary: "Serializes the Node object's attributes into a dictionary, including its id, type, path, children, and optional anchor, summary, and meta information."
          - name: from_dict
            qualname: Node.from_dict
            summary: "Creates a `Node` instance from an input dictionary `d` by mapping its key-value pairs to the `Node` object's attributes."
      - name: make_id
        qualname: make_id
        summary: 'Creates a deterministic reference ID string by combining a `kind`, a `relpath`, and an optional `anchor`.'
  - path: src/codeatlas/patch_skel.py
    symbols:
      - name: patch_skeleton
        qualname: patch_skeleton
        summary: 'Generates a dictionary representing a BridgeAI packet skeleton for code modification based on a file path, an operation type, and an optional qualified name, run commands, and commit message.'
  - path: src/codeatlas/plan.py
    symbols:
      - name: Target
        qualname: Target
        summary: 'The `Target` class is a data structure that holds a mandatory string `path` and an optional string `qualname` to identify a specific target.'
      - name: parse_target
        qualname: parse_target
        summary: "Parses an input string, formatted as either 'path' or 'path::qualname', into a `Target` object with the corresponding path and optional qualified name."
      - name: build_plan
        qualname: build_plan
        summary: 'This backward-compatible function constructs a plan dictionary for a single target by collecting its details and delegating the creation to the `build_plan_multi` function.'
      - name: build_plan_multi
        qualname: build_plan_multi
        summary: 'This function constructs an LLM execution plan by taking a goal and code targets, intelligently gathering relevant context including symbol usages, and generating patch skeletons for the desired operation.'
      - name: render_prompt_text
        qualname: render_prompt_text
        summary: "The `render_prompt_text` function generates a formatted string prompt for an LLM by combining a user's goal, project context, and a patch skeleton from an input dictionary bundle."
  - path: src/codeatlas/proposal.py
    symbols:
      - name: build_proposal_packet
        qualname: build_proposal_packet
        summary: "Given paths to a JSON bundle (defining a goal and targets) and a change packet (with code modifications), this function generates a dictionary that categorizes changes into 'primary' and 'dependent' groups, including the before-and-after code for each, to create a self-contained proposal for review."
        children:
          - name: get_before_code
            qualname: build_proposal_packet.get_before_code
            summary: 'Retrieves the source code as a string from a specified file path, either for the entire file or a specific symbol identified by its qualified name, returning an error message if the source is not found.'
  - path: src/codeatlas/py_extract.py
    symbols:
      - name: extract_qualname_source
        qualname: extract_qualname_source
        summary: 'This function extracts a source code snippet for a given qualified name from a Python file using stored AST spans and returns a dictionary containing the code, its start and end line numbers, and other metadata.'
  - path: src/codeatlas/py_symbols.py
    symbols:
      - name: Sym
        qualname: Sym
        summary: 'The `Sym` class represents a Python symbol by storing its qualified name, kind, start line, and end line, and includes a method to serialize this information into a dictionary.'
        children:
          - name: to_dict
            qualname: Sym.to_dict
            summary: 'Converts the `Sym` object into a dictionary containing its qualified name, kind, start line, and end line.'
      - name: _Visitor
        qualname: _Visitor
        summary: 'The `_Visitor` class traverses a Python Abstract Syntax Tree to identify and collect metadata about class, method, and function definitions, storing the results as a list of `Sym` objects in its `out` attribute.'
        children:
          - name: __init__
            qualname: _Visitor.__init__
            summary: 'Initializes a `_Visitor` instance by creating an empty list for the `stack` and `out` attributes.'
          - name: visit_ClassDef
            qualname: _Visitor.visit_ClassDef
            summary: "Upon visiting an `ast.ClassDef` node, this method constructs the class's fully qualified name, appends a symbol representing it to an output list, and recursively visits its children."
          - name: visit_FunctionDef
            qualname: _Visitor.visit_FunctionDef
            summary: 'Delegates the processing of a given `ast.FunctionDef` node to the `_visit_fn` method.'
          - name: visit_AsyncFunctionDef
            qualname: _Visitor.visit_AsyncFunctionDef
            summary: 'Visits an `ast.AsyncFunctionDef` node and delegates its processing to the `_visit_fn` method.'
          - name: _visit_fn
            qualname: _Visitor._visit_fn
            summary: "Processes a function or method AST node by adding a symbol containing its qualified name, kind, and line numbers to an output list, managing a scope stack, and then recursively visiting the node's children."
      - name: list_python_symbols
        qualname: list_python_symbols
        summary: 'Parses a Python source file from a given `Path` and returns a sorted list of dictionaries, each representing a symbol with its qualified name and line span.'
  - path: src/codeatlas/resolve.py
    symbols:
      - name: lookup_path
        qualname: lookup_path
        summary: 'Looks up a relative path key in a JSON index file located within a given root directory and returns the corresponding string value, or `None` if not found.'
      - name: resolve_node
        qualname: resolve_node
        summary: "Loads a map of nodes from a directory structure specified by a root path and retrieves the corresponding node's data dictionary using a `node_id`, returning `None` if not found."
      - name: resolve_content
        qualname: resolve_content
        summary: 'Given a root directory path and a node ID string formatted as `ref:path:<relpath>`, this function resolves the relative path, reads the corresponding file, and returns its entire text content as a string.'
  - path: src/codeatlas/scan.py
    symbols:
      - name: _match_any
        qualname: _match_any
        summary: 'Checks if a given POSIX path string matches any of the shell-style wildcard patterns from an iterable, returning `True` if a match is found, otherwise `False`.'
      - name: scan_files
        qualname: scan_files
        summary: 'Recursively scans a directory from a given `root` path, returning a sorted list of relative POSIX file paths that match the `include` patterns and do not match the `exclude` patterns.'
  - path: src/codeatlas/state.py
