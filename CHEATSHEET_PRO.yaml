        children:
          - name: to_dict
            qualname: Sym.to_dict
            summary: 'Returns a dictionary representation of the `Sym` object, including its qualified name, kind, and start/end line numbers.'
      - name: _Visitor
        qualname: _Visitor
        summary: 'This `ast.NodeVisitor` subclass traverses a Python Abstract Syntax Tree to identify class, function, and method definitions, collecting their qualified names, types, and line numbers into an output list.'
        children:
          - name: __init__
            qualname: _Visitor.__init__
            summary: 'Initializes a `_Visitor` instance with an empty list attribute `stack` for strings and an empty list attribute `out` for `Sym` objects.'
          - name: visit_ClassDef
            qualname: _Visitor.visit_ClassDef
            summary: "Upon visiting an `ast.ClassDef` node, this method constructs the class's fully qualified name, appends a symbol representing it to an output list, and recursively visits its children."
          - name: visit_FunctionDef
            qualname: _Visitor.visit_FunctionDef
            summary: 'Delegates the processing of a given `ast.FunctionDef` node to the internal `_visit_fn` method.'
          - name: visit_AsyncFunctionDef
            qualname: _Visitor.visit_AsyncFunctionDef
            summary: 'This visitor method handles an asynchronous function definition node (`ast.AsyncFunctionDef`) by delegating its processing to the `_visit_fn` method.'
          - name: _visit_fn
            qualname: _Visitor._visit_fn
            summary: "This method processes a function or method AST node by creating a symbol record with its qualified name and line numbers, appending it to an output list, and then recursively visiting the node's children."
      - name: list_python_symbols
        qualname: list_python_symbols
        summary: 'Parses a Python source file from a given `Path` to extract and return a sorted list of dictionaries, each representing a symbol with its qualified name and line span.'
