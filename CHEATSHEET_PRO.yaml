  - path: src/codeatlas/store_init.py
    symbols:
      - name: init_workspace
        qualname: init_workspace
        summary: 'Initializes an Atlas workspace at a given root path by creating the `.atlas` directory and default configuration files if they are missing, then returns an `AtlasPaths` object.'
  - path: src/codeatlas/summarize.py
    symbols:
      - name: generate_summary_prompt
        qualname: generate_summary_prompt
        summary: 'Takes a symbol name and its corresponding code as string inputs and returns a formatted prompt string designed to ask an AI for a concise, one-sentence summary of that symbol.'
      - name: summarize_symbols
        qualname: summarize_symbols
        summary: 'This function processes indexed code symbols from a project directory, optionally filtered by specific file paths, and either uses an LLM to generate and save summaries or saves the prompts to files, returning a dictionary detailing the outcome for each symbol.'
      - name: update_spec_with_summaries
        qualname: update_spec_with_summaries
        summary: "Reads generated summaries from a 'summaries' directory to update the corresponding node entries in `CodeAtlas.json` and `nodes.jsonl` within a given root path, returning a dictionary with the operation's status and the number of updated nodes."
