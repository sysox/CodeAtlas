      - name: load_nodes_jsonl
        qualname: load_nodes_jsonl
        summary: 'Loads and parses a JSON Lines (JSONL) file from a given path, returning a list of dictionaries where each dictionary represents a line from the file.'
      - name: load_nodes_map
        qualname: load_nodes_map
        summary: "Loads nodes from a JSONL file specified by a path and returns a dictionary mapping each node's string ID to its corresponding node data dictionary."
      - name: write_nodes_jsonl
        qualname: write_nodes_jsonl
