  - path: src/codeatlas/analysis.py
    symbols:
      - name: find_usages_with_grep
        qualname: find_usages_with_grep
        summary: "Finds potential usages of a symbol in a Git-repository using 'git grep', returning a list of dictionaries with file path, line number, and code content for each occurrence."
  - path: src/codeatlas/apply.py
    symbols:
      - name: SymbolReplacer
        qualname: SymbolReplacer
        summary: 'SymbolReplacer is a LibCST transformer that replaces the definition of a specified function or class by fully qualified name with new code, taking a qualified name string and new code string as inputs and returning an updated CST node.'
        children:
          - name: __init__
            qualname: SymbolReplacer.__init__
            summary: 'Initializes a SymbolReplacer instance with a qualified name split into parts and a string of new code to replace, setting up initial state variables.'
          - name: visit_ClassDef
            qualname: SymbolReplacer.visit_ClassDef
            summary: 'Appends a class name to a stack and continues visiting its child nodes in a syntax tree.'
          - name: leave_ClassDef
            qualname: SymbolReplacer.leave_ClassDef
            summary: 'Handles the exit of a class definition node by updating the current qualified name stack and processing node changes.'
          - name: visit_FunctionDef
            qualname: SymbolReplacer.visit_FunctionDef
            summary: 'Appends the name of a function definition to a stack and returns True, used for tracking current function names.'
          - name: leave_FunctionDef
            qualname: SymbolReplacer.leave_FunctionDef
            summary: 'Handles the exit from a function definition node by updating the qualified name stack and processing the node transition.'
          - name: _leave_definable_node
            qualname: SymbolReplacer._leave_definable_node
            summary: 'The _leave_definable_node method checks if the current CSTNode matches a target qualified name and, if so, replaces it with a new node parsed from the provided code string.'
      - name: apply_with_cst
        qualname: apply_with_cst
        summary: "The function 'apply_with_cst' replaces a specified symbol in the source code using LibCST, returning the modified source code and a success status as a tuple."
      - name: run_command
        qualname: run_command
        summary: 'Executes a shell command from a specified directory and returns its exit code, standard output, and standard error in a dictionary.'
      - name: apply_change_packet
        qualname: apply_change_packet
        summary: 'Validates and applies code changes and operations from a change packet to a workspace, handling file modifications, run commands, and Git operations, with input paths for the workspace and the packet file, and outputting a status report with results of each operation.'
  - path: src/codeatlas/cli.py
    symbols:
      - name: main
        qualname: main
        summary: 'The `main` function processes command-line arguments using `argparse` to perform various operations on a workspace, including initialization, indexing, diffing, regex-based searching, Python symbol extraction, node resolution, context export, patch generation, and other functionalities, outputting results in JSON format and returning an exit status code.'
  - path: src/codeatlas/compression.py
    symbols:
      - name: compress_node
        qualname: compress_node
        summary: "Compresses a node dictionary into a format for a Generic Code Tree, converting fields like 'type' to short identifiers and optionally expanding file or code block content from disk based on the node's path and type."
      - name: build_machine_core
        qualname: build_machine_core
        summary: "Generates a compressed 'Machine Core' dictionary of the project by resolving the project root path and optionally expanding specified node IDs into inline text."
  - path: src/codeatlas/ctx.py
    symbols:
      - name: _cap_bytes
        qualname: _cap_bytes
        summary: 'The _cap_bytes function truncates a UTF-8 encoded string to fit within a specified byte limit, ensuring the string remains valid UTF-8 and indicating if truncation occurred with a flag.'
      - name: _slice_lines
        qualname: _slice_lines
        summary: 'Slices a string into its head and/or tail lines based on optional counts, returning the sliced string and a boolean indicating if lines were omitted.'
      - name: build_ctx
        qualname: build_ctx
        summary: 'The `build_ctx` function generates a JSON-serializable context bundle by resolving node IDs from paths and IDs, optionally including content slices and size caps, producing a dictionary with selected items and any encountered errors.'
  - path: src/codeatlas/diff.py
    symbols:
      - name: compute_diff
        qualname: compute_diff
        summary: 'Computes the difference between old and new file fingerprints in a given directory, returning a dictionary with the comparison results and total file count.'
  - path: src/codeatlas/fingerprint.py
    symbols:
      - name: fingerprint_file
        qualname: fingerprint_file
        summary: 'Computes the SHA-256 hash of a file specified by the path and returns its hexadecimal digest.'
      - name: build_fingerprints
        qualname: build_fingerprints
        summary: 'Generates a dictionary mapping file relative paths to their fingerprints by resolving them from a root directory.'
      - name: diff_fingerprints
        qualname: diff_fingerprints
        summary: "Compares two dictionaries of string pairs and returns a dictionary categorizing keys as 'added', 'deleted', 'changed', or 'unchanged' based on their presence and value differences."
  - path: src/codeatlas/grep.py
    symbols:
      - name: grep_snippets
        qualname: grep_snippets
        summary: "The function 'grep_snippets' searches a file at a given path for a regex pattern and returns context lines around matches up to a maximum number, providing details of each match with error handling for file existence and regex compilation."
  - path: src/codeatlas/humanize.py
    symbols:
      - name: _generate_diff
        qualname: _generate_diff
        summary: "Generates a unified diff string showing changes between two text inputs, 'before' and 'after', for a given filename."
      - name: _render_changes_to_yaml
        qualname: _render_changes_to_yaml
        summary: 'This function formats a list of code changes into a structured YAML representation, grouping by file paths and detailing operations, which is appended to the provided list of YAML lines.'
      - name: render_proposal_yaml
        qualname: render_proposal_yaml
        summary: "Generates a YAML-formatted report summarizing a causal proposal's goal and impact based on the provided dictionary of changes, including the number of files and symbols modified."
      - name: render_project_cheatsheet
        qualname: render_project_cheatsheet
        summary: 'Generates a YAML cheatsheet summarizing the project structure based on a given machine core dictionary, detailing files and symbols up to a specified level of detail, and returns it as a string.'
        children:
          - name: render_node
            qualname: render_project_cheatsheet.render_node
            summary: 'The function `render_project_cheatsheet.render_node` recursively formats and appends details of a node, including its type, path, anchor, summary, and children, from a node map based on the provided node identifier and indentation level to a global list `lines`.'
  - path: src/codeatlas/index.py
    symbols:
      - name: _kind_from_path
        qualname: _kind_from_path
        summary: "Determines the file type from a relative path by returning a string based on the file's extension, such as 'py' for Python files, 'md' for Markdown files, and 'other' if the extension is unrecognized."
      - name: build_or_update
        qualname: build_or_update
        summary: "The function 'build_or_update' deeply indexes a workspace from a root path, creating nodes for files and symbols with outputs including statistics on total files, indexed nodes, file differences, and the path to the Atlas directory."
  - path: src/codeatlas/layout.py
    symbols:
      - name: AtlasPaths
        qualname: AtlasPaths
        summary: "The AtlasPaths class manages directory and file paths within an 'atlas' structure rooted at a specified path, providing property access to various subdirectories and paths, and includes a method to ensure the required directories exist."
        children:
          - name: atlas_dir
            qualname: AtlasPaths.atlas_dir
            summary: "Returns the directory path for Atlas configuration by appending '.atlas' to the root path."
          - name: cfg_path
            qualname: AtlasPaths.cfg_path
            summary: "Returns the file path to 'cfg.json' within the 'atlas_dir' directory as a Path object."
          - name: tree_dir
            qualname: AtlasPaths.tree_dir
            summary: "Returns the directory path to the 'tree' subdirectory within the atlas directory."
          - name: nodes_path
            qualname: AtlasPaths.nodes_path
            summary: "Generates the file path for the 'nodes.jsonl' file within the directory specified by 'tree_dir'."
          - name: index_dir
            qualname: AtlasPaths.index_dir
            summary: "Returns the path to the 'index' directory by appending 'index' to the path stored in tree_dir."
          - name: paths_index_path
            qualname: AtlasPaths.paths_index_path
            summary: "Returns the file path for 'paths.json' within the specified index directory as a Path object."
          - name: fingerprints_path
            qualname: AtlasPaths.fingerprints_path
            summary: "Returns the file path of 'fingerprints.json' within the 'tree_dir' directory."
          - name: blobs_dir
            qualname: AtlasPaths.blobs_dir
            summary: "Returns the path to the 'blobs' directory within the tree directory as a Path object."
          - name: log_dir
            qualname: AtlasPaths.log_dir
            summary: "Returns the path to the log directory by appending 'log' to the atlas directory path."
          - name: ensure_dirs
            qualname: AtlasPaths.ensure_dirs
            summary: 'Creates all necessary directories for atlas, tree, index, blobs, and log if they do not exist, ensuring the entire path is created if required.'
  - path: src/codeatlas/llm.py
    symbols:
      - name: call_llm_api
        qualname: call_llm_api
        summary: "Executes a request to an LLM API with a prompt and configuration, returning the JSON response, supporting 'openai' and 'gemini' providers."
      - name: _call_openai
        qualname: _call_openai
        summary: 'Sends a prompt to the OpenAI API using the specified model and API key, and returns the parsed JSON response or an error if the request or parsing fails.'
      - name: _call_gemini
        qualname: _call_gemini
        summary: 'The function `_call_gemini` sends a prompt to the Google Gemini API using specified headers and configuration, returning the parsed JSON response or an error message as a dictionary.'
  - path: src/codeatlas/model.py
    symbols:
      - name: Node
        qualname: Node
        summary: "The 'Node' class represents a structure with attributes like id, type, and path, converts itself to a dictionary, and can be instantiated from a dictionary with optional anchor, summary, children, and meta attributes."
        children:
          - name: to_dict
            qualname: Node.to_dict
            summary: "Converts a Node object's attributes, including optional anchor, summary, and meta information, into a dictionary representation."
          - name: from_dict
            qualname: Node.from_dict
            summary: "Creates a Node instance from a dictionary by extracting keys like 'id', 'type', 'path', and optional attributes such as 'anchor', 'summary', and nested 'children' and 'meta' dictionaries."
      - name: make_id
        qualname: make_id
        summary: 'Generates a deterministic string ID based on the provided kind, relative path, and optional anchor.'
  - path: src/codeatlas/patch_skel.py
    symbols:
      - name: patch_skeleton
        qualname: patch_skeleton
        summary: "The function 'patch_skeleton' creates a dictionary representing a BridgeAI packet skeleton for either replacing a symbol or file in the specified path, using optional parameters like qualname, operation type, run commands, and commit message, and returns it as a dictionary."
  - path: src/codeatlas/plan.py
    symbols:
      - name: Target
        qualname: Target
        summary: 'A class representing a target with a file path and an optional qualified name.'
      - name: parse_target
        qualname: parse_target
        summary: 'Parses a string representing a target, returning a Target object with a path and an optional qualified name.'
      - name: build_plan
        qualname: build_plan
        summary: 'Constructs a backward-compatible, single-target plan using specified parameters like path, content, and operation, then forwards it to build_plan_multi, returning a dictionary representing the plan.'
      - name: build_plan_multi
        qualname: build_plan_multi
        summary: "The 'build_plan_multi' function constructs a context bundle for a large language model by intelligently expanding relevant file content based on specified targets, and returns a dictionary with the operation details, including expanded context, target paths, and operation patches."
      - name: render_prompt_text
        qualname: render_prompt_text
        summary: "Renders a JSON bundle into a text prompt for a language model, using keys 'patches' and 'machine_core' for context and 'goal' for task description, returning the formatted string output."
  - path: src/codeatlas/proposal.py
    symbols:
      - name: build_proposal_packet
        qualname: build_proposal_packet
        summary: "Builds a proposal packet for review by analyzing and organizing changes from JSON bundle and packet files into primary and dependent categories, returning a dictionary with the operation's success status, goal, and change details."
        children:
          - name: get_before_code
            qualname: build_proposal_packet.get_before_code
            summary: "Returns the source code of a specified file or qualified name, or an error message if the file or symbol doesn't exist."
  - path: src/codeatlas/py_extract.py
    symbols:
      - name: extract_qualname_source
        qualname: extract_qualname_source
        summary: 'Extracts and returns the source code snippet surrounding a given qualified name (qualname) from a file, along with metadata, while handling missing files or qualnames with context line adjustments.'
  - path: src/codeatlas/py_symbols.py
    symbols:
      - name: Sym
        qualname: Sym
        summary: 'The Sym class represents a code symbol with attributes for its qualified name, type, and location, and provides a method to output its data as a dictionary.'
        children:
          - name: to_dict
            qualname: Sym.to_dict
            summary: "Converts the Sym object's attributes into a dictionary with keys 'qualname', 'kind', 'start_line', and 'end_line'."
      - name: _Visitor
        qualname: _Visitor
        summary: 'The _Visitor class traverses an abstract syntax tree (AST) of Python code to collect symbols such as class and function definitions, storing their qualified names and line numbers in the out list while maintaining a stack to track nested definitions.'
        children:
          - name: __init__
            qualname: _Visitor.__init__
            summary: 'Initializes a _Visitor object with an empty list stack for storing strings and an empty list out for storing Sym objects.'
          - name: visit_ClassDef
            qualname: _Visitor.visit_ClassDef
            summary: 'Visits a Python class definition node, capturing its qualified name and line numbers, and updating the internal state with this information before continuing the traversal.'
          - name: visit_FunctionDef
            qualname: _Visitor.visit_FunctionDef
            summary: 'Processes an AST FunctionDef node by delegating to an internal visit function.'
          - name: visit_AsyncFunctionDef
            qualname: _Visitor.visit_AsyncFunctionDef
            summary: 'Visits an asynchronous function definition node and processes it using a helper visitor function.'
          - name: _visit_fn
            qualname: _Visitor._visit_fn
            summary: 'The _visit_fn method records function or method information from an AST node, including its qualified name and line numbers, into an output list.'
      - name: list_python_symbols
        qualname: list_python_symbols
        summary: 'Parses a Python file from the specified path to return a list of dictionaries representing symbols with their qualified names and line spans, requiring Python 3.10+ for end line numbers.'
  - path: src/codeatlas/resolve.py
    symbols:
      - name: lookup_path
        qualname: lookup_path
        summary: 'Retrieves the file path associated with a given relative path from a JSON index file, using the resolved root directory.'
      - name: resolve_node
        qualname: resolve_node
        summary: 'Resolves a node by its ID in a path-based structure, returning its data as a dictionary if found.'
      - name: resolve_content
        qualname: resolve_content
        summary: "The function 'resolve_content' retrieves the entire text from a file specified by a node_id with prefix 'ref:path:' relative to a given root directory."
  - path: src/codeatlas/scan.py
    symbols:
      - name: _match_any
        qualname: _match_any
        summary: 'Determines if a given path matches any pattern in a list using Unix shell-style wildcards.'
      - name: scan_files
        qualname: scan_files
        summary: "The 'scan_files' function traverses a directory tree from a given root Path, returning a stable sorted list of relative POSIX paths for files that match specified include patterns and do not match exclude patterns."
  - path: src/codeatlas/state.py
    symbols:
      - name: load_json
        qualname: load_json
        summary: 'Reads a JSON object from a file at the specified path, returning the object or a default value if the file does not exist or is empty.'
      - name: write_json
        qualname: write_json
        summary: 'Writes a given Python object to a specified file path in JSON format, ensuring the directory exists.'
      - name: load_nodes_jsonl
        qualname: load_nodes_jsonl
        summary: 'Reads a JSON Lines file from a given path and returns a list of dictionaries, with each dictionary representing a parsed JSON object from each line.'
      - name: load_nodes_map
        qualname: load_nodes_map
        summary: 'Transforms JSON lines of node data from a file into a dictionary mapping node IDs to node details.'
      - name: write_nodes_jsonl
        qualname: write_nodes_jsonl
        summary: 'Writes a series of JSON objects from an iterable of dictionaries to a specified file in JSON Lines format.'
  - path: src/codeatlas/store_init.py
    symbols:
      - name: init_workspace
        qualname: init_workspace
        summary: 'Initializes a workspace by creating necessary directories and default configuration files, returning the configured AtlasPaths object.'
  - path: src/codeatlas/summarize.py
    symbols:
      - name: generate_summary_prompt
        qualname: generate_summary_prompt
        summary: "Generates a template for requesting a one-sentence summary of a Python symbol's purpose, inputs, and outputs, using the provided symbol name and code."
      - name: summarize_symbols
        qualname: summarize_symbols
        summary: "Generates summaries for indexed code symbols in specified paths by either calling an LLM API to produce summaries or saving summary prompts to files, based on whether 'with_llm' is set to true or false."
      - name: update_spec_with_summaries
        qualname: update_spec_with_summaries
        summary: 'The function `update_spec_with_summaries` reads generated summaries from a specified directory and integrates them into CodeAtlas.json and nodes.jsonl files, taking a root path as input and returning a dictionary indicating success status and the count of updated nodes.'
